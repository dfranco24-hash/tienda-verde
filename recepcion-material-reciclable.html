/* ---------- Utilidades ---------- */
const money = (n) => (Number(n)||0).toLocaleString("es-CO", { style:"currency", currency:"COP", maximumFractionDigits:0 });
const kg = (n) => `${(Number(n)||0).toLocaleString("es-CO",{ maximumFractionDigits:2 })} kg`;
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => iso ? new Date(iso+"T12:00:00").toLocaleDateString("es-CO",{ day:"2-digit", month:"short", year:"numeric" }) : "—";

/* ---------- UI compartida ---------- */
const inputStyle = { borderColor:"var(--border)" };
function TextInput(props){ return <input {...props} className={`w-full rounded-xl border px-3.5 py-2.5 text-sm bg-white outline-none transition ${props.className||""}`} style={inputStyle} />; }
function Select({ children, ...props }){ return <select {...props} className={`w-full rounded-xl border px-3.5 py-2.5 text-sm bg-white outline-none ${props.className||""}`} style={inputStyle}>{children}</select>; }
function Textarea(props){ return <textarea rows={2} {...props} className={`w-full rounded-xl border px-3.5 py-2.5 text-sm bg-white outline-none ${props.className||""}`} style={inputStyle} />; }

function EstadoBadge({ pagado, onClick, updating }){
  return (
    <button onClick={onClick} disabled={updating}
      className="inline-flex items-center gap-1.5 text-xs font-600 px-2.5 py-1 rounded-full transition active:scale-95 disabled:opacity-60 disabled:cursor-wait"
      style={ pagado ? { background:"#E7F3EB", color:"var(--primary-dark)" } : { background:"#FBEFE7", color:"#9A5A1F" } }
      title={updating ? "Actualizando..." : "Toca para cambiar el estado"}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: updating ? "#9AA79A" : (pagado ? "var(--primary)" : "#C98A2C") }}></span>
      {updating ? "Actualizando..." : (pagado ? "Pagado" : "Pendiente")}
    </button>
  );
}

/* ---------- Panel de estadísticas ---------- */
function StatCard({ label, value, sub, icon }){
  return (
    <div className="bg-white rounded-2xl border p-5 flex flex-col gap-1 shadow-sm" style={{ borderColor:"var(--border)" }}>
      <div className="flex items-center justify-between">
        <span className="text-xs font-medium uppercase tracking-wide" style={{ color:"var(--ink-muted)" }}>{label}</span>
        <span className="text-lg">{icon}</span>
      </div>
      <span className="font-display text-2xl sm:text-[26px] font-700" style={{ color:"var(--ink)" }}>{value}</span>
      {sub && <span className="text-xs" style={{ color:"var(--ink-muted)" }}>{sub}</span>}
    </div>
  );
}

function StatsPanel({ stats }){
  return (
    <div className="rise-in">
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
        <StatCard label="Total kilos" value={kg(stats.totalKg)} sub={`${stats.registros} recepciones`} icon="⚖️" />
        <StatCard label="Valor total comprado" value={money(stats.totalValor)} sub="acumulado histórico" icon="💰" />
        <StatCard label="Por pagar" value={money(stats.montoPendiente)} sub={`${stats.pendientesCount} pendientes`} icon="🕓" />
        <StatCard label="Proveedores" value={stats.proveedoresCount} sub="con recepciones" icon="🧑‍🤝‍🧑" />
        <StatCard label="Precio prom. / kg" value={money(stats.totalKg ? stats.totalValor/stats.totalKg : 0)} sub="promedio ponderado" icon="📊" />
      </div>

      <div className="bg-white rounded-2xl border p-5 sm:p-6 mt-4 shadow-sm" style={{ borderColor:"var(--border)" }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display font-600 text-base" style={{ color:"var(--ink)" }}>Kilos recibidos por material</h2>
          <span className="text-xs font-mono" style={{ color:"var(--ink-muted)" }}>{kg(stats.totalKg)} total</span>
        </div>
        <div className="flex flex-col gap-3">
          {stats.porMaterial.map(m => {
            const pct = stats.maxKg ? (m.kgTotal/stats.maxKg)*100 : 0;
            const share = stats.totalKg ? (m.kgTotal/stats.totalKg)*100 : 0;
            return (
              <div key={m.id} className="flex items-center gap-3">
                <div className="w-28 sm:w-40 shrink-0 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background:m.color }}></span>
                  <span className="text-sm truncate" style={{ color:"var(--ink)" }}>{m.nombre}</span>
                </div>
                <div className="flex-1 h-2.5 rounded-full bg-[color:var(--bg)] border overflow-hidden" style={{ borderColor:"var(--border)" }}>
                  <div className="h-full rounded-full transition-all duration-500" style={{ width:`${pct}%`, background:m.color }}></div>
                </div>
                <div className="w-24 sm:w-28 shrink-0 text-right font-mono text-sm" style={{ color:"var(--ink)" }}>{kg(m.kgTotal)}</div>
                <div className="w-12 shrink-0 text-right text-xs hidden sm:block" style={{ color:"var(--ink-muted)" }}>{share.toFixed(0)}%</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- Formulario de recepción ---------- */
function RecepcionForm({ materials, providers, onSubmit, onCreateProvider }){
  const [providerId, setProviderId] = useState(providers[0]?.id || "");
  const [nuevoProveedor, setNuevoProveedor] = useState(false);
  const [nombreNuevo, setNombreNuevo] = useState("");
  const [materialId, setMaterialId] = useState(materials[0]?.id || "");
  const [pesoBruto, setPesoBruto] = useState("");
  const [tara, setTara] = useState("");
  const [precioKg, setPrecioKg] = useState(materials[0]?.rate || 0);
  const [responsable, setResponsable] = useState("");
  const [estadoInicial, setEstadoInicial] = useState("pendiente");
  const [observaciones, setObservaciones] = useState("");
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const material = findMaterial(materials, materialId);
  const brutoNum = parseFloat(pesoBruto) || 0;
  const taraNum = parseFloat(tara) || 0;
  const pesoNeto = pesoBruto ? Math.max(0, brutoNum - taraNum) : 0;
  const precioNum = parseFloat(precioKg) || 0;
  const total = pesoNeto * precioNum;

  const onMaterialChange = (id) => { setMaterialId(id); setPrecioKg(findMaterial(materials, id).rate); };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if(submitting) return;
    let pid = providerId;
    if(nuevoProveedor){
      if(!nombreNuevo.trim()){ setError("Escribe el nombre del nuevo proveedor."); return; }
      setSubmitting(true);
      const creado = await onCreateProvider(nombreNuevo.trim());
      if(!creado.ok){ setError(creado.error || "No se pudo crear el proveedor en Google Sheets."); setSubmitting(false); return; }
      pid = creado.id;
    }
    if(!pid){ setError("Selecciona o crea un proveedor."); return; }
    if(pesoNeto <= 0){ setError("Ingresa el peso (debe ser mayor a 0)."); setSubmitting(false); return; }
    setError(""); setSubmitting(true);
    const resultado = await onSubmit({
      fecha: todayISO(), providerId: pid, materialId,
      pesoBruto: pesoBruto ? brutoNum : undefined, tara: tara ? taraNum : undefined,
      peso: pesoNeto, precioKg: precioNum, pagado: estadoInicial === "pagado",
      responsable: responsable.trim(), observaciones: observaciones.trim(),
    });
    setSubmitting(false);
    if(resultado.ok){
      setPesoBruto(""); setTara(""); setResponsable(""); setObservaciones(""); setNuevoProveedor(false); setNombreNuevo("");
    } else {
      setError(resultado.error || "No se pudo guardar la recepción en Google Sheets.");
    }
  };

  return (
    <form onSubmit={handleSubmit} className="bg-white rounded-2xl border p-5 sm:p-6 shadow-sm h-fit lg:sticky lg:top-5 rise-in" style={{ borderColor:"var(--border)" }}>
      <h2 className="font-display font-600 text-base mb-4" style={{ color:"var(--ink)" }}>Nueva recepción</h2>

      <div className="flex flex-col gap-4">
        <div>
          <div className="flex items-center justify-between mb-1.5">
            <label className="text-xs font-medium" style={{ color:"var(--ink-muted)" }}>Proveedor / recolector</label>
            <button type="button" onClick={()=>setNuevoProveedor(v=>!v)} className="text-xs font-600" style={{ color:"var(--primary)" }}>
              {nuevoProveedor ? "Elegir de la lista" : "+ Nuevo proveedor"}
            </button>
          </div>
          {nuevoProveedor ? (
            <TextInput value={nombreNuevo} onChange={e=>setNombreNuevo(e.target.value)} placeholder="Nombre del proveedor" />
          ) : (
            <Select value={providerId} onChange={e=>setProviderId(e.target.value)}>
              {providers.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </Select>
          )}
        </div>

        <div>
          <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Material</label>
          <Select value={materialId} onChange={e=>onMaterialChange(e.target.value)}>
            {materials.map(m => <option key={m.id} value={m.id}>{m.nombre}{m.precioPendiente ? " — precio pendiente" : ` — ${money(m.rate)}/kg`}</option>)}
          </Select>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Peso (kg) <span style={{color:"var(--danger)"}}>*</span></label>
            <TextInput type="number" min="0" step="0.01" value={pesoBruto} onChange={e=>setPesoBruto(e.target.value)} placeholder="0.00" className="font-mono" autoFocus />
          </div>
          <div>
            <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Tara (opcional)</label>
            <TextInput type="number" min="0" step="0.01" value={tara} onChange={e=>setTara(e.target.value)} placeholder="0.00" className="font-mono" />
          </div>
        </div>
        {tara && parseFloat(tara)>0 && (
          <p className="text-[11px] -mt-2.5" style={{ color:"var(--ink-muted)" }}>Peso neto: <strong className="font-mono">{pesoNeto.toFixed(2)} kg</strong> (peso − tara)</p>
        )}

        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Precio / kg</label>
            <TextInput type="number" min="0" step="1" value={precioKg} onChange={e=>setPrecioKg(e.target.value)} className="font-mono" />
          </div>
          <div>
            <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Responsable</label>
            <TextInput value={responsable} onChange={e=>setResponsable(e.target.value)} placeholder="Quién recibió" />
          </div>
        </div>

        <div>
          <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Estado del pago</label>
          <div className="flex gap-2">
            {["pendiente","pagado"].map(v => (
              <button key={v} type="button" onClick={()=>setEstadoInicial(v)}
                className="flex-1 text-sm font-600 py-2 rounded-xl border transition"
                style={ estadoInicial===v
                  ? { background: v==="pagado" ? "var(--primary)" : "#C98A2C", borderColor:"transparent", color:"#fff" }
                  : { background:"#fff", borderColor:"var(--border)", color:"var(--ink-muted)" }}>
                {v === "pagado" ? "Pagado" : "Pendiente"}
              </button>
            ))}
          </div>
        </div>

        <div>
          <label className="text-xs font-medium block mb-1.5" style={{ color:"var(--ink-muted)" }}>Observaciones</label>
          <Textarea value={observaciones} onChange={e=>setObservaciones(e.target.value)} />
        </div>

        {error && (
          <div className="flex items-center gap-2 rounded-xl px-3.5 py-2.5" style={{ background:"#FBEAEA" }}>
            <span style={{ color:"var(--danger)" }}>⚠</span>
            <p className="text-sm font-600" style={{ color:"var(--danger)" }}>{error}</p>
          </div>
        )}

        <div className="scale-display rounded-xl px-4 py-3.5 mt-1">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[10px] uppercase tracking-widest text-emerald-200/50 font-mono">Total a pagar</span>
            <span className="text-[10px] uppercase tracking-widest text-emerald-200/50 font-mono">{material.nombre}</span>
          </div>
          <div className={`font-mono text-2xl sm:text-[28px] font-600 scale-digits ${total===0?"dim":""}`}>{money(total)}</div>
          <div className="notch mt-2.5 rounded-full opacity-30"></div>
          <div className="flex justify-between mt-2 text-[11px] font-mono text-emerald-200/50">
            <span>{pesoNeto.toFixed(2)} kg</span>
            <span>× {money(precioNum)}/kg</span>
          </div>
        </div>

        <button type="submit" disabled={submitting} className="w-full rounded-xl py-3 text-sm font-600 text-white transition active:scale-[0.98] hover:opacity-95 disabled:opacity-60" style={{ background:"var(--primary)" }}>
          {submitting ? "Guardando…" : "Guardar recepción"}
        </button>
      </div>
    </form>
  );
}

/* ---------- Historial ---------- */
const PAGE_SIZE = 20;

function HistoryPanel({ records, providersById, materials, onTogglePagado, onExport, onReload, refreshing, updatingIds }){
  const [filter, setFilter] = useState("todos");
  const [q, setQ] = useState("");
  const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);

  const sorted = useMemo(() => [...records].sort((a,b) => b.fecha.localeCompare(a.fecha)), [records]);
  const filtered = useMemo(() => {
    let rows = sorted;
    if(filter === "pendiente") rows = rows.filter(r => !r.pagado);
    if(filter === "pagado") rows = rows.filter(r => r.pagado);
    if(q.trim()){
      const needle = q.toLowerCase();
      rows = rows.filter(r => (providersById[r.providerId]?.nombre||"").toLowerCase().includes(needle));
    }
    return rows;
  }, [sorted, filter, q, providersById]);
  const pendientesCount = useMemo(() => records.filter(r => !r.pagado).length, [records]);
  const visible = filtered.slice(0, visibleCount);

  const changeFilter = (f) => { setFilter(f); setVisibleCount(PAGE_SIZE); };

  return (
    <div className="bg-white rounded-2xl border shadow-sm flex flex-col rise-in" style={{ borderColor:"var(--border)" }}>
      <div className="flex flex-col gap-3 px-5 sm:px-6 py-4 border-b" style={{ borderColor:"var(--border)" }}>
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <div>
            <h2 className="font-display font-600 text-base" style={{ color:"var(--ink)" }}>Historial de recepciones</h2>
            <p className="text-xs mt-0.5" style={{ color:"var(--ink-muted)" }}>{records.length} en total · {pendientesCount} pendientes</p>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={onReload} disabled={refreshing} title="Recargar desde Google Sheets"
              className="text-xs px-3 py-2 rounded-xl border transition hover:bg-[color:var(--bg)] disabled:opacity-50" style={{ borderColor:"var(--border)", color:"var(--ink-muted)" }}>
              {refreshing ? "…" : "🔄"}
            </button>
            <button onClick={onExport} className="flex items-center gap-1.5 rounded-xl border px-3.5 py-2 text-xs font-600 transition hover:bg-[color:var(--bg)]" style={{ borderColor:"var(--border)", color:"var(--primary-dark)" }}>⬇ Exportar</button>
          </div>
        </div>

        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-1.5">
            {[
              { id:"todos", label:`Todos (${records.length})` },
              { id:"pendiente", label:`Pendientes (${pendientesCount})` },
              { id:"pagado", label:`Pagados (${records.length - pendientesCount})` },
            ].map(f => (
              <button key={f.id} onClick={()=>changeFilter(f.id)} className="text-xs font-600 px-3 py-1.5 rounded-full border transition"
                style={ filter===f.id ? { background:"var(--primary)", borderColor:"var(--primary)", color:"#fff" } : { background:"#fff", borderColor:"var(--border)", color:"var(--ink-muted)" }}>
                {f.label}
              </button>
            ))}
          </div>
          <input value={q} onChange={e=>{setQ(e.target.value); setVisibleCount(PAGE_SIZE);}} placeholder="Buscar proveedor..." className="text-xs rounded-full border px-3 py-1.5 outline-none ml-auto w-40" style={inputStyle} />
        </div>
      </div>

      {filtered.length === 0 && (
        <p className="px-6 py-10 text-center text-sm" style={{ color:"var(--ink-muted)" }}>
          {records.length===0 ? "Aún no hay recepciones. Agrega la primera desde el formulario." : "No hay registros en esta categoría."}
        </p>
      )}

      {/* Tarjetas — móvil */}
      <div className="sm:hidden flex flex-col divide-y" style={{ borderColor:"var(--border)" }}>
        {visible.map(r => {
          const m = findMaterial(materials, r.materialId);
          const total = Number(r.peso) * r.precioKg;
          return (
            <div key={r.id} className="px-5 py-3.5 flex flex-col gap-2">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <p className="font-medium text-sm" style={{ color:"var(--ink)" }}>{providersById[r.providerId]?.nombre || "—"}</p>
                  <span className="inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full mt-1" style={{ background:"var(--bg)", color:"var(--ink)" }}>
                    <span className="w-1.5 h-1.5 rounded-full" style={{ background:m.color }}></span>{m.nombre}
                  </span>
                </div>
                <div className="text-right shrink-0">
                  <p className="font-mono font-600 text-sm" style={{ color:"var(--ink)" }}>{money(total)}</p>
                  <p className="font-mono text-xs" style={{ color:"var(--ink-muted)" }}>{kg(r.peso)}</p>
                </div>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-xs" style={{ color:"var(--ink-muted)" }}>{fmtDate(r.fecha)}</span>
                <EstadoBadge pagado={r.pagado} onClick={()=>onTogglePagado(r.id)} updating={updatingIds.has(r.id)} />
              </div>
            </div>
          );
        })}
      </div>

      {/* Tabla — escritorio */}
      <div className="hidden sm:block overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-xs uppercase tracking-wide" style={{ color:"var(--ink-muted)" }}>
              <th className="px-5 sm:px-6 py-3 font-medium">Proveedor</th>
              <th className="px-3 py-3 font-medium">Material</th>
              <th className="px-3 py-3 font-medium text-right">Bruto</th>
              <th className="px-3 py-3 font-medium text-right">Tara</th>
              <th className="px-3 py-3 font-medium text-right">Neto</th>
              <th className="px-3 py-3 font-medium text-right">Precio/kg</th>
              <th className="px-3 py-3 font-medium text-right">Total</th>
              <th className="px-3 py-3 font-medium">Fecha</th>
              <th className="px-3 py-3 font-medium text-right pr-5 sm:pr-6">Estado</th>
            </tr>
          </thead>
          <tbody>
            {visible.map(r => {
              const m = findMaterial(materials, r.materialId);
              const total = Number(r.peso) * r.precioKg;
              return (
                <tr key={r.id} className="border-t hover:bg-[color:var(--bg)]/60 transition" style={{ borderColor:"var(--border)" }}>
                  <td className="px-5 sm:px-6 py-3 font-medium" style={{ color:"var(--ink)" }}>{providersById[r.providerId]?.nombre || "—"}</td>
                  <td className="px-3 py-3">
                    <span className="inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded-full" style={{ background:"var(--bg)", color:"var(--ink)" }}>
                      <span className="w-1.5 h-1.5 rounded-full" style={{ background:m.color }}></span>{m.nombre}
                    </span>
                  </td>
                  <td className="px-3 py-3 text-right font-mono text-xs" style={{ color:"var(--ink-muted)" }}>{r.pesoBruto ? kg(r.pesoBruto) : "—"}</td>
                  <td className="px-3 py-3 text-right font-mono text-xs" style={{ color:"var(--ink-muted)" }}>{r.tara ? kg(r.tara) : "—"}</td>
                  <td className="px-3 py-3 text-right font-mono">{kg(r.peso)}</td>
                  <td className="px-3 py-3 text-right font-mono text-xs" style={{ color:"var(--ink-muted)" }}>{money(r.precioKg)}</td>
                  <td className="px-3 py-3 text-right font-mono font-600">{money(total)}</td>
                  <td className="px-3 py-3 text-xs" style={{ color:"var(--ink-muted)" }}>{fmtDate(r.fecha)}</td>
                  <td className="px-3 py-3 text-right pr-5 sm:pr-6"><EstadoBadge pagado={r.pagado} onClick={()=>onTogglePagado(r.id)} updating={updatingIds.has(r.id)} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {visibleCount < filtered.length && (
        <div className="px-5 sm:px-6 py-4 border-t flex justify-center" style={{ borderColor:"var(--border)" }}>
          <button onClick={()=>setVisibleCount(v=>v+PAGE_SIZE)} className="text-sm font-600 px-4 py-2 rounded-xl border transition hover:bg-[color:var(--bg)]" style={{ borderColor:"var(--border)", color:"var(--primary-dark)" }}>
            Ver {Math.min(PAGE_SIZE, filtered.length-visibleCount)} más ({filtered.length-visibleCount} restantes)
          </button>
        </div>
      )}
    </div>
  );
}

/* ---------- Exportar ---------- */
function buildCSV(records, providersById, materials){
  const header = ["Proveedor","Material","Peso bruto","Tara","Peso neto (kg)","Precio/kg","Total","Fecha","Estado","Responsable","Observaciones"];
  const rows = records.map(r => {
    const m = findMaterial(materials, r.materialId);
    const total = Number(r.peso) * r.precioKg;
    return [providersById[r.providerId]?.nombre||"", m.nombre, r.pesoBruto??"", r.tara??"", Number(r.peso).toFixed(2), r.precioKg, total, r.fecha, r.pagado?"Pagado":"Pendiente", r.responsable||"", r.observaciones||""];
  });
  return [header, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
}

function buildSummary(records, stats){
  const lines = [];
  lines.push(`REPORTE DE RECEPCIÓN — MATERIAL RECICLABLE`);
  lines.push(`Fecha de generación: ${fmtDate(todayISO())}`);
  lines.push(``);
  lines.push(`Total recepciones: ${records.length}`);
  lines.push(`Total kilos recibidos: ${stats.totalKg.toFixed(2)} kg`);
  lines.push(`Valor total comprado: ${money(stats.totalValor)}`);
  lines.push(`Pendiente por pagar: ${money(stats.montoPendiente)} (${stats.pendientesCount} registros)`);
  lines.push(``);
  lines.push(`Desglose por material:`);
  stats.porMaterial.filter(m => m.kgTotal > 0).forEach(m => {
    lines.push(`  - ${m.nombre}: ${m.kgTotal.toFixed(2)} kg`);
  });
  return lines.join("\n");
}

function ExportModal({ records, stats, providersById, materials, onClose }){
  const [copied, setCopied] = useState(false);
  const summary = useMemo(() => buildSummary(records, stats), [records, stats]);
  const downloadedRef = useRef(false);

  useEffect(() => {
    if(downloadedRef.current) return;
    downloadedRef.current = true;
    const csv = buildCSV(records, providersById, materials);
    const blob = new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `recepcion-reciclaje-${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }, []);

  const copySummary = async () => {
    try{ await navigator.clipboard.writeText(summary); setCopied(true); setTimeout(()=>setCopied(false),2000); }catch(e){}
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background:"rgba(15,27,20,0.45)" }} onClick={onClose}>
      <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl pop-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-1">
          <span className="w-9 h-9 rounded-full flex items-center justify-center text-lg" style={{ background:"#E7F3EB" }}>✅</span>
          <h3 className="font-display font-700 text-lg" style={{ color:"var(--ink)" }}>Reporte generado</h3>
        </div>
        <p className="text-sm mb-4" style={{ color:"var(--ink-muted)" }}>Se descargó el CSV con {records.length} recepciones. Puedes copiar el resumen para enviarlo por chat o correo.</p>
        <pre className="text-xs font-mono whitespace-pre-wrap rounded-xl border p-3.5 max-h-52 overflow-y-auto mb-4" style={{ borderColor:"var(--border)", background:"var(--bg)", color:"var(--ink)" }}>{summary}</pre>
        <div className="flex gap-2">
          <button onClick={copySummary} className="flex-1 rounded-xl py-2.5 text-sm font-600 text-white transition hover:opacity-95" style={{ background:"var(--primary)" }}>{copied?"¡Copiado!":"Copiar resumen"}</button>
          <button onClick={onClose} className="flex-1 rounded-xl py-2.5 text-sm font-600 border transition hover:bg-[color:var(--bg)]" style={{ borderColor:"var(--border)", color:"var(--ink)" }}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Toast ---------- */
function Toast({ toast }){
  const bg = toast.type==="success" ? "var(--primary-dark)" : toast.type==="error" ? "var(--danger)" : "#3A4A3E";
  const icon = toast.type==="success" ? "✓" : toast.type==="error" ? "⚠" : "•";
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pop-in">
      <div className="flex items-center gap-2 px-4 py-2.5 rounded-full shadow-lg text-sm font-500 text-white max-w-[90vw]" style={{ background: bg }}>
        <span>{icon}</span><span className="truncate">{toast.text}</span>
      </div>
    </div>
  );
}

/* ---------- Copia de seguridad (solo lectura: descarga lo que hay ahora en Sheets) ---------- */
function BackupModal({ providers, records, materials, onClose }){
  const [copyStatus, setCopyStatus] = useState("");
  const textareaRef = useRef(null);

  const backup = { tipo:"respaldo-recepcion-reciclaje", exportadoEn: new Date().toISOString(), materials, providers, records };
  const json = JSON.stringify(backup, null, 2);

  const downloadFile = () => {
    try{
      const blob = new Blob([json], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `respaldo-recepcion-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      setCopyStatus("descargado");
    }catch(e){
      setCopyStatus("descarga-fallo");
    }
  };

  const copyAll = async () => {
    try{
      await navigator.clipboard.writeText(json);
      setCopyStatus("copiado");
    }catch(e){
      if(textareaRef.current){ textareaRef.current.focus(); textareaRef.current.select(); }
      setCopyStatus("selecciona-manual");
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background:"rgba(15,27,20,0.45)" }} onClick={onClose}>
      <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl pop-in max-h-[88vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display font-700 text-lg" style={{ color:"var(--ink)" }}>Copia de seguridad</h3>
          <button onClick={onClose} className="text-xl leading-none" style={{ color:"var(--ink-muted)" }}>×</button>
        </div>
        <div className="flex flex-col gap-3">
          <p className="text-sm" style={{ color:"var(--ink-muted)" }}>
            {materials.length} materiales, {providers.length} proveedores y {records.length} recepciones — tal como están ahora mismo en tu Google Sheet.
            Esto es solo una copia de lectura para guardar aparte; para restaurar datos, edita el Google Sheet directamente.
          </p>
          <div className="flex gap-2">
            <button onClick={downloadFile} className="flex-1 rounded-xl py-2.5 text-sm font-600 text-white" style={{ background:"var(--primary)" }}>⬇ Descargar archivo</button>
            <button onClick={copyAll} className="flex-1 rounded-xl py-2.5 text-sm font-600 border" style={{ borderColor:"var(--border)", color:"var(--ink)" }}>📋 Copiar todo</button>
          </div>
          {copyStatus === "descargado" && <p className="text-xs" style={{ color:"var(--primary-dark)" }}>Archivo descargado.</p>}
          {copyStatus === "descarga-fallo" && <p className="text-xs" style={{ color:"var(--danger)" }}>La descarga no funcionó aquí — usa "Copiar todo" en su lugar.</p>}
          {copyStatus === "copiado" && <p className="text-xs" style={{ color:"var(--primary-dark)" }}>Copiado al portapapeles.</p>}
          {copyStatus === "selecciona-manual" && <p className="text-xs" style={{ color:"var(--danger)" }}>No se pudo copiar automáticamente — el texto de abajo ya quedó seleccionado, usa "Copiar" de tu teclado.</p>}
          <textarea ref={textareaRef} readOnly value={json} className="w-full text-[10px] font-mono rounded-xl border p-3 h-40" style={{ borderColor:"var(--border)", background:"var(--bg)" }} onFocus={e=>e.target.select()} />
        </div>
      </div>
    </div>
  );
}

function App(){
  const [materials, setMaterials] = useState([]);
  const [providers, setProviders] = useState([]);
  const [records, setRecords] = useState([]);
  const [loadStatus, setLoadStatus] = useState(SHEETS_CONFIGURED ? "cargando" : "sin-configurar");
  const [loadError, setLoadError] = useState("");
  const [refreshing, setRefreshing] = useState(false);
  const [updatingIds, setUpdatingIds] = useState(() => new Set());
  const [skipEmpty, setSkipEmpty] = useState(false);
  const [migrating, setMigrating] = useState(false);
  const [toast, setToast] = useState(null);
  const [exportOpen, setExportOpen] = useState(false);
  const [backupOpen, setBackupOpen] = useState(false);

  const cargarDesdeSheets = async ({ initial=false } = {}) => {
    if(initial){ setLoadStatus("cargando"); setLoadError(""); } else { setRefreshing(true); }
    try{
      const res = await fetch(`${SHEETS_URL}?token=${encodeURIComponent(SHEETS_TOKEN)}`);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      setMaterials((data.materials||[]).map(m => ({
        ...m,
        rate: Number(m.rate)||0,
        precioPendiente: m.precioPendiente===true||m.precioPendiente==="true"||m.precioPendiente==="TRUE",
      })));
      setProviders(data.providers||[]);
      setRecords((data.records||[]).map(r => ({
        ...r,
        peso: Number(r.peso)||0,
        precioKg: Number(r.precioKg)||0,
        pagado: r.pagado===true||r.pagado==="true"||r.pagado==="TRUE",
      })));
      if(initial) setLoadStatus("listo");
      else setToast({ type:"success", text:"Datos actualizados desde Google Sheets" });
    }catch(e){
      if(initial){ setLoadStatus("error"); setLoadError(e.message || "Error de red"); }
      else setToast({ type:"error", text:`No se pudo actualizar: ${e.message}` });
    }
    if(!initial) setRefreshing(false);
  };

  useEffect(() => { if(SHEETS_CONFIGURED) cargarDesdeSheets({ initial:true }); }, []);
  useEffect(() => { if(!toast) return; const t=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(t); }, [toast]);

  const providersById = useMemo(() => Object.fromEntries(providers.map(p=>[p.id,p])), [providers]);

  const postToSheets = async (payload) => {
    const res = await fetch(SHEETS_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, // evita el preflight CORS de Apps Script
      body: JSON.stringify({ token: SHEETS_TOKEN, ...payload }),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  };

  const createProvider = async (nombre) => {
    const existing = providers.find(p => p.nombre.trim().toLowerCase() === nombre.toLowerCase());
    if(existing) return { ok:true, id: existing.id };
    const id = "p_" + crypto.randomUUID().slice(0,8);
    const provider = { id, nombre, telefono:"", materialFrecuente:"" };
    try{
      await postToSheets({ action:"addProvider", provider });
      setProviders(prev => [...prev, provider]);
      return { ok:true, id };
    }catch(e){
      return { ok:false, error: e.message };
    }
  };

  const addRecord = async (rec) => {
    const record = { id: crypto.randomUUID(), ...rec };
    try{
      await postToSheets({ action:"addRecord", record });
      setRecords(prev => [record, ...prev]);
      setToast({ type:"success", text:`Recepción guardada — ${providersById[rec.providerId]?.nombre || "proveedor nuevo"}` });
      return { ok:true };
    }catch(e){
      return { ok:false, error: e.message };
    }
  };

  const togglePagado = async (id) => {
    const rec = records.find(r=>r.id===id);
    if(!rec || updatingIds.has(id)) return;
    const nuevo = !rec.pagado;
    setUpdatingIds(prev => new Set(prev).add(id));
    try{
      await postToSheets({ action:"updateRecord", id, cambios:{ pagado: nuevo } });
      setRecords(prev => prev.map(r => r.id===id ? { ...r, pagado: nuevo } : r));
    }catch(e){
      setToast({ type:"error", text:`No se pudo actualizar el estado: ${e.message}` });
    }
    setUpdatingIds(prev => { const s = new Set(prev); s.delete(id); return s; });
  };

  const cargarDatosIniciales = async () => {
    setMigrating(true);
    try{
      await postToSheets({ action:"replaceAll", materials:DEFAULT_MATERIALS, providers:DEFAULT_PROVIDERS, records:DEFAULT_RECORDS() });
      await cargarDesdeSheets({ initial:true });
      setToast({ type:"success", text:"Catálogo y datos históricos cargados a Google Sheets." });
    }catch(e){
      setToast({ type:"error", text:`No se pudo migrar: ${e.message}` });
    }
    setMigrating(false);
  };

  const stats = useMemo(() => {
    const totalKg = records.reduce((s,r)=>s+Number(r.peso),0);
    const totalValor = records.reduce((s,r)=>s+Number(r.peso)*r.precioKg,0);
    const pendientes = records.filter(r=>!r.pagado);
    const montoPendiente = pendientes.reduce((s,r)=>s+Number(r.peso)*r.precioKg,0);
    const porMaterial = materials.map(m => {
      const recs = records.filter(r=>r.materialId===m.id);
      const kgTotal = recs.reduce((s,r)=>s+Number(r.peso),0);
      return { ...m, kgTotal, count:recs.length };
    }).sort((a,b)=>b.kgTotal-a.kgTotal);
    const maxKg = Math.max(1, ...porMaterial.map(m=>m.kgTotal));
    const proveedoresCount = new Set(records.map(r=>r.providerId)).size;
    return { totalKg, totalValor, registros:records.length, pendientesCount:pendientes.length, montoPendiente, porMaterial, maxKg, proveedoresCount };
  }, [records, materials]);

  if(loadStatus === "sin-configurar") return <SetupNotice />;
  if(loadStatus === "cargando") return <LoadingScreen />;
  if(loadStatus === "error") return <ErrorScreen message={loadError} onRetry={()=>cargarDesdeSheets({ initial:true })} />;

  const sheetVacio = materials.length===0 && providers.length===0 && records.length===0;
  if(sheetVacio && !skipEmpty){
    return <EmptyDataScreen migrating={migrating} onMigrate={cargarDatosIniciales} onSkip={()=>setSkipEmpty(true)} />;
  }

  return (
    <div className="min-h-screen pb-24">
      <Header />
      <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 sm:-mt-10 relative z-10">
        <div className="flex justify-end mb-3">
          <button onClick={()=>setBackupOpen(true)} className="inline-flex items-center gap-1.5 text-xs font-600 px-3 py-2 rounded-xl border bg-white transition hover:bg-[color:var(--bg)]" style={{ borderColor:"var(--border)", color:"var(--primary-dark)" }}>
            💾 Copia de seguridad
          </button>
        </div>
        <StatsPanel stats={stats} />
        <div className="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-5 mt-5">
          <RecepcionForm materials={materials} providers={providers} onSubmit={addRecord} onCreateProvider={createProvider} />
          <HistoryPanel records={records} providersById={providersById} materials={materials} onTogglePagado={togglePagado} onExport={()=>setExportOpen(true)} onReload={()=>cargarDesdeSheets({ initial:false })} refreshing={refreshing} updatingIds={updatingIds} />
        </div>
      </main>
      {toast && <Toast toast={toast} />}
      {exportOpen && <ExportModal records={records} stats={stats} providersById={providersById} materials={materials} onClose={()=>setExportOpen(false)} />}
      {backupOpen && <BackupModal providers={providers} records={records} materials={materials} onClose={()=>setBackupOpen(false)} />}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ console.error("Error en la aplicación:", error, info); }
  render(){
    if(this.state.error){
      return (
        <div className="min-h-screen flex items-center justify-center p-6" style={{ background:"var(--bg)" }}>
          <div className="bg-white rounded-2xl border p-6 max-w-md text-center shadow-sm" style={{ borderColor:"var(--border)" }}>
            <p className="text-3xl mb-2">⚠️</p>
            <h2 className="font-display font-700 text-lg mb-1" style={{ color:"var(--ink)" }}>Algo falló al mostrar la aplicación</h2>
            <p className="text-sm mb-4" style={{ color:"var(--ink-muted)" }}>Tus datos están seguros en Google Sheets. Intenta recargar la página; si el problema sigue, cuéntame exactamente qué hiciste antes de que apareciera esto.</p>
            <button onClick={()=>window.location.reload()} className="rounded-xl px-4 py-2.5 text-sm font-600 text-white" style={{ background:"var(--primary)" }}>Recargar</button>
            <pre className="text-[10px] text-left mt-4 p-2 rounded-lg overflow-auto max-h-32" style={{ background:"var(--bg)", color:"var(--ink-muted)" }}>{String(this.state.error?.message||this.state.error)}</pre>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
